name: Verify kernel
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p cad-cli -- build examples/bracket.star --out-dir out/bracket
      - run: cargo run --locked -p cad-cli -- build examples/tray.star --out-dir out/tray
      - run: cargo run --locked -p cad-cli -- build examples/fixture.star --out-dir out/fixture
      - run: cargo run --locked -p cad-cli -- build examples/enclosure.star --out-dir out/enclosure
      - run: cargo run --locked -p cad-cli -- build examples/mounting_array.star --out-dir out/mounting_array
      - run: cargo run --locked -p cad-cli -- build examples/reference_fixture.star --out-dir out/reference_fixture
      - run: cargo run --locked -p cad-cli -- build examples/modular_rack.star --out-dir out/modular_rack
      - run: cargo run --locked -p cad-cli -- build examples/angled_fixture.star --out-dir out/angled_fixture
      - run: cargo run --locked -p cad-cli -- build examples/datum_gantry.star --out-dir out/datum_gantry
      - run: cargo run --locked -p cad-cli -- build examples/tilted_jig.star --out-dir out/tilted_jig
      - run: cargo run --locked -p cad-cli -- build examples/clipped_tools.star --out-dir out/clipped_tools
      - run: cargo run --locked -p cad-cli -- build examples/balance_arm.star --out-dir out/balance_arm
      - run: cargo run --locked -p cad-cli -- build examples/surface_mount.star --out-dir out/surface_mount
      - run: cargo run --locked -p cad-cli -- properties examples/balance_arm.star --output balance_arm
      - run: python3 crates/cad-export/tools/check_bom_csv.py out/modular_rack/modular_rack.bom.csv out/modular_rack/modular_rack.bom.json
      - run: cargo run --locked -p cad-cli -- select examples/reference_fixture.star --from blank --role end_cap --in finished --all
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/preview-check/package-lock.json
      - run: npm ci --prefix tools/preview-check
      - run: npx playwright install --with-deps chromium
        working-directory: tools/preview-check
      - run: npm test --prefix tools/preview-check
      - run: npm run test:hosted --prefix tools/preview-check
      - run: npm run test:refresh --prefix tools/preview-check
      - run: npm run test:depth --prefix tools/preview-check
      - run: npm run test:assembly --prefix tools/preview-check
      - run: npm run test:nested --prefix tools/preview-check
      - run: npm run test:polygon --prefix tools/preview-check
      - run: npm run test:transform --prefix tools/preview-check
      - run: npm run test:clipped --prefix tools/preview-check
      - run: npm run test:datums --prefix tools/preview-check
      - run: npm run test:gpu --prefix tools/preview-check
      - run: npm run test:stream --prefix tools/preview-check
      - uses: actions/upload-artifact@v4
        with:
          name: cad-examples
          path: out/
