name: Engineering release evidence
on: [push, pull_request, workflow_dispatch]
jobs:
  engineering:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - case: counterbore
            capability: machining.counterbore-fixture
          - case: round-stock
            capability: machining.round-bearing-cartridge
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install cadquery-ocp==8.0.1.1.0
      - name: Collect native and independent engineering evidence
        run: >-
          python scripts/evidence.py collect
          --ledger evidence/ledger.json
          --capability "${{ matrix.capability }}"
          --python python
          --out-dir "${{ runner.temp }}/${{ matrix.case }}-evidence"
      - name: Verify evidence and reject altered claims
        env:
          CAD_EVIDENCE_BUNDLE: ${{ runner.temp }}/${{ matrix.case }}-evidence
        run: python -m unittest discover -s scripts/tests -v
      - name: Check STEP metadata with independent importer
        if: matrix.case == 'round-stock'
        run: python crates/cad-export/tools/check_step_metadata_ocp.py --cad target/release/cad
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.case }}-engineering-evidence
          path: ${{ runner.temp }}/${{ matrix.case }}-evidence/
