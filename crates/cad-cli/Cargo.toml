[package]
license.workspace = true
name = "cad-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cad"
path = "src/main.rs"

[dependencies]
cad-mesh = { path = "../cad-mesh" }
cad-assembly = { path = "../cad-assembly" }
cad-build = { path = "../cad-build" }
cad-kernel = { path = "../cad-kernel" }
cad-export = { path = "../cad-export" }
cad-recipe = { path = "../cad-recipe" }
cad-preview = { path = "../cad-preview" }
serde_json.workspace = true
serde.workspace = true
blake3.workspace = true
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
cap-std = "4"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
