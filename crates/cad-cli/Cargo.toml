[package]
license.workspace = true
name = "cad-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cad"
path = "src/main.rs"

[dependencies]
cad-assembly = { path = "../cad-assembly" }
cad-build = { path = "../cad-build" }
cad-kernel = { path = "../cad-kernel" }
cad-export = { path = "../cad-export" }
cad-recipe = { path = "../cad-recipe" }
cad-preview = { path = "../cad-preview" }
serde_json.workspace = true
blake3.workspace = true
clap = { version = "4", features = ["derive"] }
tempfile = "3"
cap-std = "4"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
