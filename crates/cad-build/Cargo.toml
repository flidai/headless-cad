[package]
license.workspace = true
name = "cad-build"
version = "0.1.0"
edition = "2021"

[dependencies]
cad-sketch = { path = "../cad-sketch" }
cad-kernel = { path = "../cad-kernel" }
cad-assembly = { path = "../cad-assembly" }
serde = { workspace = true }
# Solved coordinates must survive typed cache decoding without changing bits.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
blake3 = { workspace = true }

[dev-dependencies]
# Match the JSON feature enabled transitively by the Starlark frontend, even
# when this package's regression tests are run in isolation.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
tempfile = "3"
